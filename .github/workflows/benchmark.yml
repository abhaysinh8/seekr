name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  search-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm benchmark
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SEEKR_BENCHMARK_SIZES: 1000,10000,100000
      - uses: actions/upload-artifact@v4
        with:
          name: search-benchmark-${{ github.run_id }}
          path: packages/search-core/benchmark-results.json
          if-no-files-found: error
          retention-days: 30
