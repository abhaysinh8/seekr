name: seekr

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seekr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seekr_local_password}
      POSTGRES_USER: ${POSTGRES_USER:-seekr}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-seekr}:${POSTGRES_PASSWORD:-seekr_local_password}@postgres:5432/${POSTGRES_DB:-seekr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      SEEKR_INDEX_PATH: /data/index
      SEEKR_SNAPSHOT_PATH: /data/snapshots
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - index_data:/data/index
      - snapshot_data:/data/snapshots
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:4000/ready']
      interval: 10s
      timeout: 5s
      retries: 5

  crawler:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: crawler
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seekr}:${POSTGRES_PASSWORD:-seekr_local_password}@postgres:5432/${POSTGRES_DB:-seekr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      SEEKR_API_URL: http://api:4000
      SEEKR_API_KEY: ${SEEKR_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  index_data:
  postgres_data:
  redis_data:
  snapshot_data:
